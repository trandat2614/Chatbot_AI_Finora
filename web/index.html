<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Finora AI Demo</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#1b2436;font:16px/1.45 system-ui,sans-serif}main{max-width:900px;margin:36px auto;padding:0 20px 36px}h1{margin:0 0 4px}.sub,.note{color:#65718a}.sub{margin:0}.card{background:#fff;border:1px solid #e1e6ef;border-radius:12px;padding:20px;margin-top:18px;box-shadow:0 3px 12px #1b24360b}label{display:block;font-weight:650;margin:12px 0 6px}input,textarea{width:100%;border:1px solid #cbd3e1;border-radius:7px;padding:10px;font:inherit}textarea{min-height:115px;resize:vertical}button{margin-top:14px;border:0;border-radius:7px;background:#2563eb;color:#fff;padding:10px 15px;cursor:pointer;font-weight:650}button:disabled{opacity:.6;cursor:wait}#status{display:none;margin-top:18px;padding:11px;border-radius:7px;background:#eef5ff;white-space:pre-wrap}#status.error{background:#fff0f0;color:#a12222}#result{display:none;white-space:pre-wrap;line-height:1.6}.note{font-size:.9rem}</style></head>
<body><main><h1>Finora AI Demo</h1><p class="sub">Upload tài liệu, nạp RAG và đặt câu hỏi trực tiếp.</p>
<section class="card"><label for="shop-id">Shop ID đã được cấp quyền</label><input id="shop-id" value="default" maxlength="200"><label for="server-key">Server API key (X-API-Key)</label><input id="server-key" type="password" placeholder="Không phải GEMINI_API_KEY"><form id="upload-form"><label for="knowledge-file">Tài liệu knowledge (.xlsx, .xls, .csv, .md, .txt, .pdf; tối đa 10 MB)</label><input id="knowledge-file" type="file" accept=".xlsx,.xls,.csv,.md,.txt,.pdf" required><button id="upload-button" type="submit">Upload &amp; nạp private RAG</button></form></section>
<section class="card"><form id="chat-form"><label for="question">Câu hỏi cho Finora</label><textarea id="question" required placeholder="Ví dụ: Tóm tắt các rủi ro và đề xuất hành động từ tài liệu vừa upload."></textarea><button id="chat-button" type="submit">Hỏi AI</button></form></section>
<div id="status" role="status"></div><section id="result" class="card"><strong>Trả lời</strong><div id="answer"></div></section><p class="note">Không dán Gemini API key vào trang này. Nó chỉ dùng X-API-Key của server.</p></main>
<script>
const statusBox=document.getElementById('status'),resultBox=document.getElementById('result'),answerBox=document.getElementById('answer');
const keyHeaders=()=>{const key=document.getElementById('server-key').value.trim();return key?{'X-API-Key':key}:{};};
const shopId=()=>document.getElementById('shop-id').value.trim()||'default';
function setStatus(message,error=false){statusBox.textContent=message;statusBox.style.display='block';statusBox.className=error?'error':'';}
function setBusy(button,busy,label){button.disabled=busy;button.textContent=busy?'Đang xử lý...':label;}
async function api(url,options){const response=await fetch(url,options);const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.detail||`Yêu cầu thất bại (${response.status})`);return body;}
document.getElementById('upload-form').addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('upload-button'),file=document.getElementById('knowledge-file').files[0];if(!file)return setStatus('Hãy chọn file để upload.',true);setBusy(button,true,'Upload & nạp private RAG');setStatus('Đang upload và tạo embeddings...');try{const form=new FormData();form.append('file',file);const data=await api(`/api/knowledge/upload?shop_id=${encodeURIComponent(shopId())}`,{method:'POST',headers:keyHeaders(),body:form});setStatus(`${data.message} (${data.chunks} chunks)`);}catch(error){setStatus(error.message,true)}finally{setBusy(button,false,'Upload & nạp private RAG')}});
document.getElementById('chat-form').addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('chat-button'),message=document.getElementById('question').value.trim();if(!message)return;setBusy(button,true,'Hỏi AI');resultBox.style.display='none';setStatus('Đang hỏi AI...');try{const data=await api('/api/chat',{method:'POST',headers:{...keyHeaders(),'Content-Type':'application/json'},body:JSON.stringify({message,shop_id:shopId(),history:[]})});answerBox.textContent=data.answer;resultBox.style.display='block';setStatus(data.rag_context_used?'Đã sử dụng kho kiến thức.':'AI trả lời nhưng chưa dùng RAG.')}catch(error){setStatus(error.message,true)}finally{setBusy(button,false,'Hỏi AI')}});
</script></body></html>
