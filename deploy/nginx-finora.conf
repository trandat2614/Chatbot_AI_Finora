# Empty keys are not counted by limit_req; Insights still authenticate in FastAPI.
map $uri $finora_rate_limit_key {
    default $binary_remote_addr;
    ~^/api/insights(/|$) "";
}

limit_req_zone $finora_rate_limit_key zone=finora_limited_api:10m rate=30r/m;

# Optional shared demo limit for multiple Uvicorn workers (http {} scope):
# 1. Trust ONLY the actual Finora BE address; BE must overwrite X-Client-IP.
#    set_real_ip_from <FINORA_BE_IP_OR_CIDR>;
#    real_ip_header X-Client-IP;
# 2. Add this map/zone, and exempt ^/api/chatbot/demo/ from the generic map above
#    if the generic 30r/m limit would otherwise group all callers behind BE.
#    map $uri $finora_demo_key {
#        default "";
#        ~^/api/chatbot/demo/chat$ $binary_remote_addr;
#    }
#    limit_req_zone $finora_demo_key zone=finora_demo:10m rate=15r/m;
# 3. Add inside location / below:
#    limit_req zone=finora_demo burst=3 nodelay;
#    limit_req_status 429;
# To preserve demo's JSON error contract, add an error_page handler for rejected
# demo requests that returns {"error":"Ban gui tin nhan hoi nhanh. Hay thu lai."}.
# Do not enable real_ip_header without a restricted set_real_ip_from allow-list.

server {
    listen 80;
    server_name ai.finora.com.vn;

    client_max_body_size 11m;
    server_tokens off;

    location / {
        limit_req zone=finora_limited_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Finora-Service-Key $http_x_finora_service_key;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
    }
}
